<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>TaskFlow 执行记录</title>
<style>
body{font-family:system-ui,sans-serif;margin:2rem;color:#222}
nav a{margin-right:1rem}
table{border-collapse:collapse;margin-top:.5rem}
td,th{border:1px solid #ccc;padding:.4rem .7rem;text-align:left}
</style>
</head>
<body>
<h1>TaskFlow 执行记录</h1>
<nav><a href="/tasks">任务</a><a href="/schedule">调度</a><a href="/records">执行记录</a><a href="/audit">审计</a></nav>
<table id="records"><thead><tr><th>命名空间</th><th>序号</th><th>任务</th><th>尝试</th><th>状态</th><th>执行器</th></tr></thead><tbody></tbody></table>
<script>
async function load(){
  const nss = await (await fetch('/api/namespaces')).json();
  const tb = document.querySelector('#records tbody');
  tb.innerHTML = '';
  for (const ns of nss) {
    const records = await (await fetch('/api/records?namespace=' + encodeURIComponent(ns.id))).json();
    for (const r of records) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${ns.id}</td><td>${r.seq}</td><td>${r.task_id}</td><td>${r.attempt}</td><td>${r.state}</td><td>${r.executor}</td>`;
      tb.appendChild(tr);
    }
  }
}
load();
</script>
</body>
</html>
